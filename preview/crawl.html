<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crawl Preview</title>
    <style>
      html, body { margin: 0; height: 100%; background: #040b08; color: #ece6d6; font: 13px "IBM Plex Mono", ui-monospace, monospace; }
      canvas { display: block; width: 100%; height: 100%; }
      #ui { position: fixed; left: 16px; right: 16px; top: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      button { font: inherit; color: #8fa597; background: #0c1712; border: 1px solid #22352b; padding: 6px 10px; cursor: pointer; }
      button.on { color: #c9df7a; border-color: #c9df7a; }
      #info { position: fixed; left: 16px; bottom: 16px; color: #8fa597; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="ui"></div>
    <div id="info"></div>
    <script type="module" src="./crawl.ts"></script>
  </body>
</html>
